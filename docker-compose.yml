services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    # Mismo uid que el usuario del host: la DB y los backups (sqlite3 desde el
    # host) quedan con dueño tokosan.
    user: "${TRACKER_UID:-1000}:${TRACKER_GID:-1000}"
    ports:
      # Solo loopback; Caddy (mismo host) lo alcanza por localhost:8910.
      - "127.0.0.1:8910:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      # FlareSolverr escucha en el host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
